name: Continuous Integration

on:
    push:
        branches:
            - "main"
    pull_request:
        branches:
            - "main"
    workflow_dispatch:

jobs:
    build-and-create-image:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7.0.1

            - name: Setup JDK 21
              uses: actions/setup-java@v6.0.0
              with:
                distribution: temurin
                java-version: '21'
                cache: maven

            - name: Run tests
              working-directory: ./backend
              run: mvn -B test

            - name: Build image
              run: docker build -t titanguard-backend ./backend

            - name: Done
              run: echo "Build successful, image created"