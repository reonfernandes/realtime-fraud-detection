services:
    mongodb:
        image: mongo:8.0
        container_name: titan_guard_db
        ports:
            -   "27017:27017"
        volumes:
            -   mongo_data:/data/db

    redis:
        image: redis:8.8.0-alpine
        container_name: titan_guard_cache
        ports:
            -   "6379:6379"
        volumes:
            -   redis_cache_data:/data

    kafka:
        image: apache/kafka:4.2.1
        container_name: titan_guard_kafka
        ports:
            -   "9092:9092"
        environment:
            KAFKA_NODE_ID: 1
            KAFKA_PROCESS_ROLES: broker,controller
            KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
            KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
            KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
            KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
            KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
            KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
            KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
            KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
            KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
            KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
            KAFKA_NUM_PARTITIONS: 3
        volumes:
            - kafka_data:/var/lib/kafka/data

    backend:
        build: ./backend
        container_name: titan_guard_backend
        restart: unless-stopped
        ports:
            -   "8100:8100"
        environment:
            MONGODB_HOST: mongodb
            MONGODB_PORT: 27017
            MONGODB_DATABASE: ${MONGODB_DATABASE:-titan_guard}
            REDIS_HOST: redis
            REDIS_PORT: 6379
            REDIS_DATABASE: 0
            KAFKA_BOOTSTRAP_SERVERS: kafka:29092
        depends_on:
            - mongodb
            - redis
            - kafka

    prometheus:
        image: prom/prometheus:v3.7.3
        container_name: titan_guard_prometheus
        ports:
            -   "9090:9090"
        volumes:
            - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
            - prometheus_data:/prometheus
        depends_on:
            - backend

    grafana:
        image: grafana/grafana:12.3.1
        container_name: titan_guard_grafana
        ports:
            -   "3000:3000"
        environment:
            GF_SECURITY_ADMIN_USER: admin
            GF_SECURITY_ADMIN_PASSWORD: admin
        volumes:
            - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
            - grafana_data:/var/lib/grafana
        depends_on:
            - prometheus

volumes:
    mongo_data:
    redis_cache_data:
    kafka_data:
    prometheus_data:
    grafana_data:
