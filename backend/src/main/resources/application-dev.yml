server:
    port: 8100

spring:
    mongodb:
        host: ${MONGODB_HOST:localhost}
        port: ${MONGODB_PORT:27017}
        database: ${MONGODB_DATABASE:titan_guard}
    data:
        mongodb:
            auto-index-creation: true
        redis:
            host: ${REDIS_HOST:localhost}
            port: ${REDIS_PORT:6379}
            database: ${REDIS_DATABASE:0}
    kafka:
        bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
        producer:
            key-serializer: org.apache.kafka.common.serialization.StringSerializer
            value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
            retries: 3
            acks: all
        consumer:
            key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
            value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
            group-id: titan_guard_consumer
            auto-offset-reset: earliest
            enable-auto-commit: false
            properties:
                spring:
                    json:
                        trusted:
                            packages: "com.reon.titan_backend.dto"

security:
    kafka:
        topic:
            transaction: raw_transaction
    redis:
        transaction:
            key: titanguard:transaction:window
            expiration: 60
        ratelimit:
            key: titanguard:ratelimit:window
            expiration: 60
            max-requests: 5
    transactions:
        max-count: 3
        high-value-limit: 50000.0
        suspicious-window:
            start-hour: 1
            end-hour: 4
        daily-sum:
            key: titanguard:transaction:dailysum
            limit: 50000.0
            expiration-days: 1
