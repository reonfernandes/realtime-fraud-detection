server:
    port: 8100

spring:
    mongodb:
        host: ${MONGODB_HOST:localhost}
        port: ${MONGODB_PORT:27017}
        database: ${MONGODB_DATABASE:titan_guard}
    data:
        mongodb:
            auto-index-creation: true
        redis:
            host: ${REDIS_HOST:localhost}
            port: ${REDIS_PORT:6379}
            database: ${REDIS_DATABASE:0}
    kafka:
        bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
        producer:
            key-serializer: org.apache.kafka.common.serialization.StringSerializer
            value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
            retries: 3
            acks: all
        consumer:
            key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
            value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
            group-id: titan_guard_consumer
            auto-offset-reset: earliest
            enable-auto-commit: false
            properties:
                spring:
                    json:
                        trusted:
                            packages: "com.reon.titan_backend.dto"

security:
    kafka:
        topic:
            transaction: raw_transaction
            partitions: 3
        consumer:
            concurrency: 3
    redis:
        transaction:
            key: titanguard:transaction:window
            expiration: 60
        ratelimit:
            key: titanguard:ratelimit:window
            expiration: 60
            max-requests: ${RATE_LIMIT_MAX_REQUESTS:5}
        authratelimit:
            key: titanguard:ratelimit:auth
            expiration: 300
            max-requests: 10
        processed:
            key: titanguard:transaction:processed
            expiration: 3600
    admin:
        # local only account so the admin endpoints are usable, prod reads these from the environment
        email: ${ADMIN_EMAIL:admin@titanguard.local}
        password: ${ADMIN_PASSWORD:Admin@123}
    transactions:
        max-count: 3
        high-value-limit: 50000.0
        suspicious-window:
            start-hour: 1
            end-hour: 4
        daily-sum:
            key: titanguard:transaction:dailysum
            limit: 50000.0
            expiration-days: 1
    jwt:
        # local only key, prod reads it from the environment
        secret-key: ${JWT_SECRET:dGl0YW5ndWFyZC1sb2NhbC1kZXZlbG9wbWVudC1vbmx5LXNlY3JldC1rZXktNDhi}
        issuer: ${JWT_ISSUER:titanguard}
        access-token-name: ${ACCESS_TOKEN_NAME:access_token}
        access-token-expiry: ${ACCESS_TOKEN_EXPIRY:3600}
    cookie:
        name: ${COOKIE_NAME:access_token}
        expiry: ${COOKIE_EXPIRY:3600}
        secure: ${COOKIE_SECURE:false}

management:
    endpoints:
        web:
            exposure:
                include: health,info,prometheus

springdoc:
    swagger-ui:
        path: /swagger-ui.html
        operations-sorter: method
